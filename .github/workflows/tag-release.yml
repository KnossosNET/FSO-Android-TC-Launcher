name: Build draft Android release

on:
  push:
    tags:
      - '**'

permissions:
  contents: read

concurrency:
  group: draft-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Check out the tagged source and native libraries
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: false

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 scripts/ci-signing.py

      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: false

      - name: Install pinned Android build tools
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdk_manager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdk_manager" ]]; then
            echo "::error::Android SDK Manager is missing or not executable: $sdk_manager"
            exit 1
          fi
          "$sdk_manager" --sdk_root="$sdk_root" --licenses >/dev/null < <(yes 2>/dev/null)
          "$sdk_manager" --sdk_root="$sdk_root" --install \
            'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.14033849' 'cmake;3.22.1'
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$sdk_root" "$sdk_root" >> "$GITHUB_ENV"

      - name: Run script tests and build every game
        shell: bash
        run: |
          python3 -m unittest discover -s scripts/tests -v
          chmod +x gradlew
          ./gradlew --no-daemon :core:test releaseApks

      - name: Verify generated APKs
        shell: bash
        run: |
          shopt -s nullglob
          apks=(dist/*-signed.apk)
          test "${#apks[@]}" -gt 0
          for apk in "${apks[@]}"; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk"
            "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 "$apk"
            python3 scripts/check-native-pages.py "$apk"
          done

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/github-draft-release.py "$RELEASE_TAG"

      - name: Remove temporary signing files
        if: ${{ always() }}
        run: python3 scripts/ci-signing.py --clean
